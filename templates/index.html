{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}

<div class="container py-4">

    <h1 class="text-center mb-3">
        Welcome to TCG SCANNER
    </h1>

    <p class="text-center mb-4">
        Scan your Pokémon cards and build your Pokédex collection
    </p>

    <button
        type="button"
        class="btn btn-outline-primary btn-lg d-block mx-auto mb-4"
        style="border-color: #9344fc; color: #9344fc;"
        onclick="init()">

        Start Scanner

    </button>

  
    <div id="webcam-container" class="text-center mb-3"></div>

  
    <div id="class-container" class="text-center">
        <h2 id="class-name"></h2>
    </div>

    <div id="label-container" style="display: none;"></div>

    
    <div id="pokemon-card"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>


<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>


<script src="{{ url_for('static', filename='js/scanner.js') }}"></script>

{% endblock %}
